version: '3.9'

services:
  # =========================================================================
  # Backend Service (FastAPI)
  # =========================================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: skyguardai-backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://skyguard:skyguard123@db:5432/skyguardai
      - REDIS_URL=redis://redis:6379/0
      - ENV=development
      - LOG_LEVEL=INFO
    volumes:
      - ./backend:/app/backend
      - ./data:/app/data
      - backend-logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - skyguard-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # =========================================================================
  # Frontend Service (React)
  # =========================================================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: skyguardai-frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://backend:8000/api
      - REACT_APP_WS_URL=ws://backend:8000/ws
    volumes:
      - ./frontend/src:/app/frontend/src
      - ./frontend/public:/app/frontend/public
      - /app/frontend/node_modules
    depends_on:
      - backend
    networks:
      - skyguard-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # =========================================================================
  # PostgreSQL Database
  # =========================================================================
  db:
    image: postgres:14-alpine
    container_name: skyguardai-db
    environment:
      POSTGRES_USER: skyguard
      POSTGRES_PASSWORD: skyguard123
      POSTGRES_DB: skyguardai
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - skyguard-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skyguard -d skyguardai"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =========================================================================
  # Redis Cache
  # =========================================================================
  redis:
    image: redis:7-alpine
    container_name: skyguardai-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - skyguard-network
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ""
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =========================================================================
  # pgAdmin (Database Management - Optional)
  # =========================================================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: skyguardai-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@skyguardai.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - db
    networks:
      - skyguard-network
    restart: unless-stopped

  # =========================================================================
  # Nginx Reverse Proxy (Optional - Production)
  # =========================================================================
  nginx:
    image: nginx:alpine
    container_name: skyguardai-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    networks:
      - skyguard-network
    restart: unless-stopped

# ============================================================================
# Networks
# ============================================================================
networks:
  skyguard-network:
    driver: bridge

# ============================================================================
# Volumes
# ============================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  backend-logs:
    driver: local
